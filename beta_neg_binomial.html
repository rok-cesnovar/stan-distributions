<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" type="text/css" href="style.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://d3js.org/d3.v6.js"></script>
  <script src="math-js-wasm/beta_neg_binomial.js"></script>
  <script src="stan-distribution-zoo.js"></script>
  <script>
    var x;
    var y;
    var svg;
    var xAxis;
    var yAxis;
    var data = [];
    var params = {
      n_range: 40,
      r: 5,
      alpha: 3,
      beta: 3
    };
    var continuous = false;
    function update_data() {
      data = []
      for (let n = 0; n < params.n_range; n = n + 1) {
        let res = Module.beta_neg_binomial_lpmf(n, params.r, params.alpha, params.beta)
        if ($("#exp-check")[0].checked) {
          res = Math.exp(res)
        }
        data.push({ ser1: n, ser2: res })
      }
    }
    var Module = {
      onRuntimeInitialized: function () {
        setup_page(
          {
            function_name: "beta_neg_binomial_lpmf (n | r, alpha, beta)",
            sliders: [
              {
                name: "n_range", text: "Range of n",
                value: params.n_range, min: 1, max: 200, step: 1
              },
              {
                name: "r", text: "r",
                value: params.r, min: 0.1, max: 50, step: 0.1
              },
              {
                name: "alpha", text: "alpha",
                value: params.alpha, min: 0.1, max: 50, step: 0.1
              },
              {
                name: "beta", text: "beta",
                value: params.beta, min: 0.1, max: 50, step: 0.1
              }
            ],
            exponentiate: true,
            x_axis_text: "n"
          }
        )
      }
    }
  </script>
</head>

<body>
  <div id="figure"></div>
</body>

</html>
