<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" type="text/css" href="style.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://d3js.org/d3.v6.js"></script>
  <script src="math-js-wasm/bernoulli.js"></script>
  <script src="stan-distribution-zoo.js"></script>
  <script>
    var x;
    var y;
    var svg;
    var xAxis;
    var yAxis;
    var data = [];
    var params = {
      theta: 0.5
    };
    var continuous = false;
    function update_data() {
      data = []
      for (let n = 0; n <= 1; n = n + 1) {
        let res = Module.bernoulli_lpmf(n, params.theta)
        if ($("#exp-check")[0].checked) {
          res = Math.exp(res)
        }
        data.push({ ser1: n, ser2: res })
      }
    }
    var Module = {
      onRuntimeInitialized: function () {
        setup_page(
          {
            function_name: "bernoulli_lpmf (n | theta)",
            sliders: [
              {
                name: "theta", text: "theta",
                value: params.theta, min: 0.01, max: 0.99, step: 0.01
              }
            ],
            exponentiate: true,
            x_axis_text: "n"
          }
        )
      }
    }
  </script>
</head>

<body>
  <div id="figure"></div>
</body>

</html>
